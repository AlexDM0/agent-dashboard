<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agent-dashboard</title>
    <link rel="icon" href="data:,">
    <script>
      /* Resolve the theme before first paint from the key every agent-progress page shares: the saved choice wins,
         otherwise the OS preference. Mirrors the head script of agent-progress's resources/template.html. */
      (function () {
        var choice = null;
        try { choice = localStorage.getItem("agent-progress:theme"); } catch (error) {}
        if (choice !== "light" && choice !== "dark") { choice = "auto"; }
        var dark = choice === "dark" || (choice === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-choice", choice);
      })();
    </script>
    <link rel="stylesheet" href="./styles/Tokens.css">
    <link rel="stylesheet" href="./styles/Dashboard.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./Main.tsx"></script>
  </body>
</html>
