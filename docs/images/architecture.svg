<svg xmlns="http://www.w3.org/2000/svg" width="720" height="528" viewBox="0 0 720 528" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Reads everything, writes only through its owners</title>
  <desc>You use the browser page, which holds one event stream to the dashboard server. The server reads the agent-progress registry, each board's status and each board's own page. On your click it starts a supervisor that holds an orchestrator or product-owner Claude Code session, or runs the agent-progress CLI itself; only the CLI writes a tracked repository's .agent-progress tracker.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
    <marker id="ahl" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="526" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">Reads everything, writes only through its owners</text>
  <text x="40" y="68" font-size="13" fill="#73726c">the dashboard never edits a tracker or the registry itself</text>

  <!-- connectors -->
  <g fill="none" stroke="#bfbdb0" stroke-width="1.6">
    <path d="M92,120 L120,120" marker-end="url(#ah)"/>
    <path d="M340,120 L408,120" marker-start="url(#ahl)" marker-end="url(#ah)"/>
    <path d="M480,148 L480,172 L200,172 L200,204" marker-end="url(#ah)"/>
    <path d="M560,148 L560,204" marker-end="url(#ah)"/>
    <path d="M560,260 L560,268" marker-end="url(#ah)"/>
    <path d="M560,324 L560,332" marker-end="url(#ah)"/>
    <path d="M664,148 L664,168 L700,168 L700,362 L684,362" marker-end="url(#ah)"/>
    <path d="M560,388 L560,436" marker-end="url(#ah)"/>
    <path d="M200,436 L200,392" marker-end="url(#ah)"/>
  </g>
  <g font-size="11" fill="#73726c">
    <text x="374" y="110" text-anchor="middle">events</text>
    <text x="374" y="138" text-anchor="middle">clicks</text>
    <text x="340" y="165" text-anchor="middle">reads</text>
    <text x="552" y="184" text-anchor="end">on your click</text>
    <text x="572" y="420">writes</text>
    <text x="212" y="420">read</text>
  </g>

  <!-- the page and the server -->
  <rect x="40" y="92" width="48" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="64" y="125" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">You</text>

  <rect x="124" y="92" width="212" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="230" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Browser page</text>
  <text x="230" y="134" font-size="12" fill="#185FA5" text-anchor="middle">React · one event stream</text>

  <rect x="412" y="92" width="268" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="546" y="116" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Dashboard server</text>
  <text x="546" y="134" font-size="12" fill="#185FA5" text-anchor="middle">Bun · 127.0.0.1:4710</text>

  <!-- what it reads -->
  <rect x="40" y="208" width="320" height="180" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="60" y="234" font-size="14" font-weight="500" fill="#444441">Reads, on every change</text>
  <text x="60" y="264" font-size="13" font-weight="500" fill="#444441">projects.json</text>
  <text x="60" y="281" font-size="12" fill="#73726c">the registry agent-progress writes</text>
  <text x="60" y="311" font-size="13" font-weight="500" fill="#444441">agent-progress status --json --full</text>
  <text x="60" y="328" font-size="12" fill="#73726c">each board's counts, never recomputed</text>
  <text x="60" y="358" font-size="13" font-weight="500" fill="#444441">progress.html</text>
  <text x="60" y="375" font-size="12" fill="#73726c">each project's own page, framed from :4711</text>

  <!-- what acts on a click -->
  <rect x="412" y="208" width="268" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="546" y="230" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Supervisor</text>
  <text x="546" y="248" font-size="12" fill="#854F0B" text-anchor="middle">detached · outlives a server restart</text>

  <rect x="412" y="272" width="268" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="546" y="294" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Claude Code session</text>
  <text x="546" y="312" font-size="12" fill="#854F0B" text-anchor="middle">orchestrator · product owner</text>

  <rect x="412" y="336" width="268" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="546" y="358" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">agent-progress CLI</text>
  <text x="546" y="376" font-size="12" fill="#854F0B" text-anchor="middle">concurrency · stop · every ticket move</text>

  <!-- the repositories -->
  <rect x="40" y="440" width="644" height="56" rx="8" fill="#EAF3DE" stroke="#CFE3B6"/>
  <text x="362" y="464" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Each tracked repository</text>
  <text x="362" y="482" font-size="12" fill="#3B6D11" text-anchor="middle">its .agent-progress/ tracker, written only by the agent-progress CLI</text>
</svg>
